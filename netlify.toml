[build]
  command = "npm run shared:build && npm run admin:build"
  publish = "web-admin/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[env.production]
  BACKEND_URL = "https://api.parivaarapp.in"

[env.preview]
  BACKEND_URL = "https://api.parivaarapp.in"

[env.development]
  BACKEND_URL = "https://api.parivaarapp.in"

# Proxy only the public endpoints the form uses (CDN-level, no CORS needed)
[[redirects]]
  from = "/api/communities/*"
  to = "https://api.parivaarapp.in/api/communities/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/users/check-phone-public"
  to = "https://api.parivaarapp.in/api/users/check-phone-public"
  status = 200
  force = true

[[redirects]]
  from = "/api/approvals/public/submit-family"
  to = "https://api.parivaarapp.in/api/approvals/public/submit-family"
  status = 200
  force = true
