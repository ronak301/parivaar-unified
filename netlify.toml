[build]
  command = "npm run shared:build && npm run admin:build"
  publish = "web-admin/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[env.production]
  BACKEND_URL = "https://api.parivaarapp.in"
  NEXT_PUBLIC_API_URL = "https://api.parivaarapp.in"

[env.preview]
  BACKEND_URL = "https://api.parivaarapp.in"
  NEXT_PUBLIC_API_URL = "https://api.parivaarapp.in"

[env.development]
  BACKEND_URL = "https://api.parivaarapp.in"
  NEXT_PUBLIC_API_URL = "https://api.parivaarapp.in"
