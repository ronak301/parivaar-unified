[build]
  command = "npm run shared:build && npm run admin:build"
  publish = "web-admin/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[env.production]
  BACKEND_URL = "https://api.parivaarapp.in"

[env.preview]
  BACKEND_URL = "https://api.parivaarapp.in"

[env.development]
  BACKEND_URL = "https://api.parivaarapp.in"

# Proxy all /api/* requests to the backend — runs at CDN level, no CORS needed
[[redirects]]
  from = "/api/*"
  to = "https://api.parivaarapp.in/api/:splat"
  status = 200
  force = true
