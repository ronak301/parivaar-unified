name: Diagnose Backend

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-backend.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Check public URLs from GitHub runner (outside Groww network)
        run: |
          echo "=== api.parivaarapp.in/health from GH runner ==="
          curl -sS -i --max-time 10 https://api.parivaarapp.in/health || true
          echo ""
          echo "=== parivaardirectory.netlify.app from GH runner ==="
          curl -sS -i --max-time 10 https://parivaardirectory.netlify.app || true
          echo ""
          echo "=== api.parivaarapp.in/api/communities from GH runner ==="
          curl -sS -i --max-time 10 https://api.parivaarapp.in/api/communities || true
          echo ""
          echo "=== api.parivaarapp.in/ (root) from GH runner ==="
          curl -sS -i --max-time 10 https://api.parivaarapp.in/ || true
          echo ""
          echo "=== POST admin-login from GH runner ==="
          curl -sS -i --max-time 15 -X POST https://api.parivaarapp.in/api/auth/admin-login \
            -H "Content-Type: application/json" \
            -d '{"phone":"9999999999","password":"12345"}' || true
          echo ""
          echo "=== POST admin-login via Netlify (parivaardirectory.netlify.app) ==="
          curl -sS -i --max-time 20 -X POST https://parivaardirectory.netlify.app/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"phone":"9999999999","password":"12345"}' || true

      - name: SSH to VM and inspect (read-only)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/ronak/parivaar-web-unified
            echo "=== git log (VM checkout) ==="
            git log --oneline -5
            echo "=== git status (VM checkout) ==="
            git status
            cd backend
            echo "=== dist/routes/index.js content ==="
            docker exec parivaar-api-v2 cat /app/backend/dist/routes/index.js 2>&1
            echo "=== dist/routes/auth.js grep admin-login ==="
            docker exec parivaar-api-v2 grep -n "admin-login" /app/backend/dist/routes/auth.js 2>&1
            echo "=== dist/app.js grep app.use ==="
            docker exec parivaar-api-v2 grep -n "app.use" /app/backend/dist/app.js 2>&1
            echo "=== container entrypoint / actual running process ==="
            docker exec parivaar-api-v2 sh -c "cat /app/backend/package.json | grep -A3 '\"scripts\"'"
            docker exec parivaar-api-v2 ps aux 2>&1
            echo "=== dist/routes/index.js file mtime vs auth.js mtime ==="
            docker exec parivaar-api-v2 sh -c "ls -la /app/backend/dist/routes/ /app/backend/dist/*.js"
            echo "=== image build time / container created time ==="
            docker inspect parivaar-api-v2 --format '{{.Created}}'
            docker inspect parivaar-api-v2 --format '{{.Image}}'
            echo "=== docker compose ps ==="
            docker compose -f docker-compose.prod.yml ps
            echo "=== docker ps -a (all containers) ==="
            docker ps -a
            echo "=== app logs (last 100 lines) ==="
            docker compose -f docker-compose.prod.yml logs app --tail 100
            echo "=== local health check ==="
            curl -sS -i http://localhost:3002/health --max-time 5 || true
            echo "=== caddy container status (if present) ==="
            docker ps -a --filter "name=caddy"
            echo "=== caddy logs (last 60 lines, if present) ==="
            docker logs $(docker ps -aq --filter "name=caddy") --tail 60 2>&1 || true
            echo "=== cloudflared tunnel status (if present) ==="
            docker ps -a --filter "name=cloudflared"
            echo "=== cloudflared logs (last 80 lines, if present) ==="
            docker logs $(docker ps -aq --filter "name=cloudflared") --tail 80 2>&1 || true
            echo "=== caddy config (running, via API if available) ==="
            docker exec caddy cat /etc/caddy/Caddyfile 2>&1 || true
            echo "=== curl localhost via caddy container name network (internal) ==="
            docker exec caddy wget -qO- --header="Host: api.parivaarapp.in" http://localhost:80/health 2>&1 || true
            echo "=== caddy container mounts (to find host path of Caddyfile) ==="
            docker inspect caddy --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'

      - name: Fix Caddy routing (api.parivaarapp.in -> parivaar-api-v2)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            CF=/home/ubuntu/apps/caddy/data/Caddyfile
            SUDO=""
            [ -w "$CF" ] || SUDO="sudo -n"
            echo "=== before ==="
            $SUDO cat "$CF"
            $SUDO cp "$CF" "$CF.bak.$(date +%s)"
            $SUDO sed -i 's/^    reverse_proxy backend:80$/    reverse_proxy parivaar-api-v2:3001/' "$CF"
            echo "=== after ==="
            $SUDO cat "$CF"
            echo "=== validate ==="
            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "=== reload ==="
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "=== verify locally on VM ==="
            sleep 2
            curl -sS -i --max-time 10 -X POST https://api.parivaarapp.in/api/auth/admin-login \
              -H "Content-Type: application/json" \
              -d '{"phone":"9999999999","password":"12345"}' || true
            echo "=== cloudflared tunnel config (ingress rules) ==="
            docker inspect cloudflared-tunnel --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'
            docker exec cloudflared-tunnel cat /etc/cloudflared/config.yml 2>&1 || true
            docker exec cloudflared-tunnel find /etc/cloudflared -type f 2>&1 || true
            echo "=== cloudflared inspect Config/Cmd/Env ==="
            docker inspect cloudflared-tunnel --format '{{.Config.Cmd}}'
            docker inspect cloudflared-tunnel --format '{{.Config.Env}}'
            echo "=== curl VM's own public IP directly (bypass DNS/CF proxy), if reachable ==="
            curl -sS -i --max-time 10 -X POST http://localhost:3002/api/auth/admin-login \
              -H "Content-Type: application/json" \
              -d '{"phone":"9999999999","password":"12345"}' || true
