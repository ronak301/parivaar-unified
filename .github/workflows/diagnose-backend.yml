name: Diagnose Backend

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-backend.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Check public URLs from GitHub runner (outside Groww network)
        run: |
          echo "=== api.parivaarapp.in/health from GH runner ==="
          curl -sS -i --max-time 10 https://api.parivaarapp.in/health || true
          echo ""
          echo "=== parivaardirectory.netlify.app from GH runner ==="
          curl -sS -i --max-time 10 https://parivaardirectory.netlify.app || true
          echo ""
          echo "=== api.parivaarapp.in/api/communities from GH runner ==="
          curl -sS -i --max-time 10 https://api.parivaarapp.in/api/communities || true
          echo ""
          echo "=== api.parivaarapp.in/ (root) from GH runner ==="
          curl -sS -i --max-time 10 https://api.parivaarapp.in/ || true
          echo ""
          echo "=== POST admin-login from GH runner ==="
          curl -sS -i --max-time 15 -X POST https://api.parivaarapp.in/api/auth/admin-login \
            -H "Content-Type: application/json" \
            -d '{"phone":"9999999999","password":"12345"}' || true
          echo ""
          echo "=== POST admin-login via Netlify (parivaardirectory.netlify.app) ==="
          curl -sS -i --max-time 20 -X POST https://parivaardirectory.netlify.app/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"phone":"9999999999","password":"12345"}' || true

      - name: SSH to VM and inspect (read-only)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/ronak/parivaar-web-unified
            echo "=== git log (VM checkout) ==="
            git log --oneline -5
            echo "=== git status (VM checkout) ==="
            git status
            cd backend
            echo "=== dist/routes/index.js content ==="
            docker exec parivaar-api-v2 cat /app/backend/dist/routes/index.js 2>&1
            echo "=== dist/routes/auth.js grep admin-login ==="
            docker exec parivaar-api-v2 grep -n "admin-login" /app/backend/dist/routes/auth.js 2>&1
            echo "=== dist/app.js grep app.use ==="
            docker exec parivaar-api-v2 grep -n "app.use" /app/backend/dist/app.js 2>&1
            echo "=== container entrypoint / actual running process ==="
            docker exec parivaar-api-v2 sh -c "cat /app/backend/package.json | grep -A3 '\"scripts\"'"
            docker exec parivaar-api-v2 ps aux 2>&1
            echo "=== dist/routes/index.js file mtime vs auth.js mtime ==="
            docker exec parivaar-api-v2 sh -c "ls -la /app/backend/dist/routes/ /app/backend/dist/*.js"
            echo "=== image build time / container created time ==="
            docker inspect parivaar-api-v2 --format '{{.Created}}'
            docker inspect parivaar-api-v2 --format '{{.Image}}'
            echo "=== docker compose ps ==="
            docker compose -f docker-compose.prod.yml ps
            echo "=== docker ps -a (all containers) ==="
            docker ps -a
            echo "=== app logs (last 100 lines) ==="
            docker compose -f docker-compose.prod.yml logs app --tail 100
            echo "=== local health check ==="
            curl -sS -i http://localhost:3002/health --max-time 5 || true
            echo "=== caddy container status (if present) ==="
            docker ps -a --filter "name=caddy"
            echo "=== caddy logs (last 60 lines, if present) ==="
            docker logs $(docker ps -aq --filter "name=caddy") --tail 60 2>&1 || true
            echo "=== cloudflared tunnel status (if present) ==="
            docker ps -a --filter "name=cloudflared"
            echo "=== cloudflared logs (last 80 lines, if present) ==="
            docker logs $(docker ps -aq --filter "name=cloudflared") --tail 80 2>&1 || true
            echo "=== caddy config (running, via API if available) ==="
            docker exec caddy cat /etc/caddy/Caddyfile 2>&1 || true
            echo "=== curl localhost via caddy container name network (internal) ==="
            docker exec caddy wget -qO- --header="Host: api.parivaarapp.in" http://localhost:80/health 2>&1 || true
            echo "=== caddy container mounts (to find host path of Caddyfile) ==="
            docker inspect caddy --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'

      - name: Fix Caddy routing (api.parivaarapp.in -> parivaar-api-v2)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            CF=/home/ubuntu/apps/caddy/data/Caddyfile
            SUDO=""
            [ -w "$CF" ] || SUDO="sudo -n"
            echo "=== before ==="
            $SUDO cat "$CF"
            $SUDO cp "$CF" "$CF.bak.$(date +%s)"
            $SUDO sed -i 's/^    reverse_proxy backend:80$/    reverse_proxy parivaar-api-v2:3001/' "$CF"
            echo "=== after ==="
            $SUDO cat "$CF"
            echo "=== validate ==="
            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "=== reload ==="
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "=== verify locally on VM ==="
            sleep 2
            curl -sS -i --max-time 10 -X POST https://api.parivaarapp.in/api/auth/admin-login \
              -H "Content-Type: application/json" \
              -d '{"phone":"9999999999","password":"12345"}' || true
            echo "=== cloudflared tunnel config (ingress rules) ==="
            docker inspect cloudflared-tunnel --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'
            docker exec cloudflared-tunnel cat /etc/cloudflared/config.yml 2>&1 || true
            docker exec cloudflared-tunnel find /etc/cloudflared -type f 2>&1 || true
            echo "=== cloudflared inspect Config/Cmd/Env ==="
            docker inspect cloudflared-tunnel --format '{{.Config.Cmd}}'
            docker inspect cloudflared-tunnel --format '{{.Config.Env}}'
            echo "=== curl VM's own public IP directly (bypass DNS/CF proxy), if reachable ==="
            curl -sS -i --max-time 10 -X POST http://localhost:3002/api/auth/admin-login \
              -H "Content-Type: application/json" \
              -d '{"phone":"9999999999","password":"12345"}' || true
            echo "=== cloudflared config.yml (host path, no docker exec needed) ==="
            sudo cat /home/ubuntu/apps/cloudflared/data/config/config.yml 2>&1 || cat /home/ubuntu/apps/cloudflared/data/config/config.yml 2>&1 || true
            echo "=== list that dir ==="
            sudo ls -la /home/ubuntu/apps/cloudflared/data/config/ 2>&1 || ls -la /home/ubuntu/apps/cloudflared/data/config/ 2>&1 || true
            echo "=== networks: cloudflared-tunnel vs parivaar-api-v2 vs caddy vs backend ==="
            docker inspect cloudflared-tunnel --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
            docker inspect parivaar-api-v2 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
            docker inspect caddy --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
            docker inspect backend --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'

      - name: Fix cloudflared tunnel ingress (route api.parivaarapp.in -> caddy -> parivaar-api-v2)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            CFG=/home/ubuntu/apps/cloudflared/data/config/config.yml
            SUDO=""
            [ -w "$CFG" ] || SUDO="sudo -n"
            echo "=== attach cloudflared-tunnel to caddynet so it can reach caddy by name ==="
            docker network connect caddynet cloudflared-tunnel 2>&1 || true
            docker inspect cloudflared-tunnel --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
            echo "=== before ==="
            $SUDO cat "$CFG"
            $SUDO cp "$CFG" "$CFG.bak.$(date +%s)"
            $SUDO sed -i '/hostname: api.parivaarapp.in/{n;s#service: http://backend:80#service: http://caddy:80#}' "$CFG"
            echo "=== after ==="
            $SUDO cat "$CFG"
            echo "=== restart cloudflared-tunnel to pick up new ingress config ==="
            docker restart cloudflared-tunnel
            echo "=== wait for tunnel to reconnect ==="
            sleep 12
            docker logs cloudflared-tunnel --tail 30 2>&1 || true
            echo "=== verify from VM ==="
            curl -sS -i --max-time 15 -X POST https://api.parivaarapp.in/api/auth/admin-login \
              -H "Content-Type: application/json" \
              -d '{"phone":"9999999999","password":"12345"}' || true
            echo "=== caddy: can it reach parivaar-api-v2 by name? ==="
            docker exec caddy wget -qO- --header="Host: api.parivaarapp.in" http://parivaar-api-v2:3001/health 2>&1 || true
            echo "=== hit caddy directly on port 80 with Host header (bypass cloudflared) - GET /health ==="
            docker exec caddy wget -qO- -S --header="Host: api.parivaarapp.in" http://localhost:80/health 2>&1 || true
            echo "=== hit caddy directly on port 80 with Host header - POST admin-login ==="
            docker exec caddy wget -qO- -S --header="Host: api.parivaarapp.in" --header="Content-Type: application/json" --post-data='{"phone":"9999999999","password":"12345"}' http://localhost:80/api/auth/admin-login 2>&1 || true
            echo "=== current live Caddyfile on disk ==="
            cat /home/ubuntu/apps/caddy/data/Caddyfile 2>&1 || sudo cat /home/ubuntu/apps/caddy/data/Caddyfile 2>&1 || true
            echo "=== caddy port mapping on host ==="
            docker inspect caddy --format '{{json .NetworkSettings.Ports}}'
            echo "=== hit caddy's real HTTPS (443) directly on VM, correct SNI+Host via --resolve (bypass DNS/Cloudflare) ==="
            curl -sS -i -k --resolve api.parivaarapp.in:443:127.0.0.1 --max-time 10 https://api.parivaarapp.in/health || true
            echo "=== same but POST admin-login ==="
            curl -sS -i -k --resolve api.parivaarapp.in:443:127.0.0.1 --max-time 10 -X POST https://api.parivaarapp.in/api/auth/admin-login \
              -H "Content-Type: application/json" \
              -d '{"phone":"9999999999","password":"12345"}' || true
            echo "=== is there another caddy/nginx/process listening on 443 outside docker? ==="
            sudo ss -tlnp 2>&1 | grep -E ':443|:80 ' || netstat -tlnp 2>&1 | grep -E ':443|:80 ' || true
            echo "=== caddy live compiled JSON config via admin API (ground truth, not just Caddyfile source) ==="
            docker exec caddy wget -qO- http://localhost:2019/config/ 2>&1 || true
            echo "=== force a fresh reload just in case previous reload didn't fully apply ==="
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            sleep 2
            echo "=== retest after forced reload ==="
            curl -sS -i -k --resolve api.parivaarapp.in:443:127.0.0.1 --max-time 10 https://api.parivaarapp.in/health || true
            echo "=== DNS resolution of parivaar-api-v2 as seen INSIDE caddy container ==="
            docker exec caddy getent hosts parivaar-api-v2 2>&1 || true
            echo "=== actual IP of parivaar-api-v2 container on caddynet ==="
            docker inspect parivaar-api-v2 --format '{{json .NetworkSettings.Networks}}'
            echo "=== is there ANY other container also using name/alias parivaar-api-v2 or resolvable on caddynet ==="
            docker network inspect caddynet --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{"\n"}}{{end}}'
            echo "=== curl caddy's HTTPS loopback from INSIDE the caddy container itself ==="
            docker exec caddy wget -qO- -S --no-check-certificate --header="Host: api.parivaarapp.in" https://127.0.0.1/health 2>&1 || true
            echo "=== what does parivaar-api-v2 app.js actually mount (double-check root vs prefixed) ==="
            docker exec parivaar-api-v2 cat /app/backend/dist/app.js 2>&1
            echo "=== FULL Caddyfile with line numbers (check for leading global block / admin off) ==="
            cat -n /home/ubuntu/apps/caddy/data/Caddyfile 2>&1 || sudo cat -n /home/ubuntu/apps/caddy/data/Caddyfile 2>&1 || true
            echo "=== test the explicit /v2/health path (handle_path block) via direct caddy HTTPS ==="
            curl -sS -i -k --resolve api.parivaarapp.in:443:127.0.0.1 --max-time 10 https://api.parivaarapp.in/v2/health || true
            echo "=== caddy process full command line and admin listen check ==="
            docker top caddy
            docker exec caddy sh -c "cat /proc/1/cmdline | tr '\0' ' '; echo" 2>&1 || true
            echo "=== try admin API via unix socket (default caddy admin.sock path) ==="
            docker exec caddy wget -qO- --unix-socket /run/caddy/admin.sock http://localhost/config/ 2>&1 || true
            docker exec caddy sh -c "find / -name 'admin.sock' 2>/dev/null" 2>&1 || true
            echo "=== is 2019 actually listening inside caddy container? ==="
            docker exec caddy sh -c "cat /proc/net/tcp | awk 'NR>1{print \$2}'" 2>&1 || true
            echo "=== dump live compiled config via admin API forcing IPv4 (localhost may resolve to ::1 first) ==="
            docker exec caddy wget -qO- http://127.0.0.1:2019/config/ 2>&1 || true
            echo "=== FULL RESTART of caddy container (reload may not have replaced the stale catch-all route) ==="
            docker restart caddy
            sleep 5
            docker logs caddy --tail 20 2>&1 || true
            echo "=== retest root /health after full restart ==="
            curl -sS -i -k --resolve api.parivaarapp.in:443:127.0.0.1 --max-time 10 https://api.parivaarapp.in/health || true
            echo "=== retest admin-login after full restart ==="
            curl -sS -i -k --resolve api.parivaarapp.in:443:127.0.0.1 --max-time 10 -X POST https://api.parivaarapp.in/api/auth/admin-login \
              -H "Content-Type: application/json" \
              -d '{"phone":"9999999999","password":"12345"}' || true
            echo "=== retest via public DNS/Cloudflare end-to-end ==="
            curl -sS -i --max-time 15 -X POST https://api.parivaarapp.in/api/auth/admin-login \
              -H "Content-Type: application/json" \
              -d '{"phone":"9999999999","password":"12345"}' || true
