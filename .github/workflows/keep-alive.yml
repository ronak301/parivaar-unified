name: Keep Alive

# Supabase free tier pauses a project after ~7 days without database activity.
# The old backend (current mobile app) runs on Supabase, so hit an endpoint that
# queries it every day. Also checks the new backend. A failing run means
# something is down — GitHub emails the repo owner.
#
# Runs the checks on the VM over SSH: GitHub runners time out reaching
# api.parivaarapp.in through Cloudflare.
on:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping old and new backends from the VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            fail=0
            check() {
              code=$(curl -sS -o /tmp/keepalive.out -w '%{http_code}' --max-time 30 "$2" || echo 000)
              echo "$1: HTTP $code"; head -c 200 /tmp/keepalive.out; echo
              [ "$code" = "200" ] || fail=1
            }
            check "Old backend (Supabase)" http://localhost:8081/community/all
            check "New backend (MongoDB)" http://localhost:3002/api/communities
            exit $fail
