services:
  app:
    build: .
    ports:
      - "3001:3001"
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/parivaar
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo-data:
